<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quintile Dashboard</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800&family=Inter:wght@400;500;600&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style id="css">
/* VOICE: clinical, like a newspaper graphics desk - black ink on white paper
   IDEA: a printed league table / ranking sheet for a district
   PICTURE: a rank strip from 1 to the last store, cut into five quintile bands, every store pinned on it
   COLOUR and TYPE: royal blue brand on cool white; quintiles run green (Q1) to amber to red (Q5); Inter Tight + Inter
   LAYOUT: sticky top bar with tabs + filters, finding as title, strip, cards, tables */

/* ---------- 1. Theme colours ---------- */
:root{color-scheme:light dark;--bg:light-dark(#e6e9f0,#0a0d18);--card:light-dark(#fff,#151b2e);--ink:light-dark(#141a2e,#eef1f8);--mut:light-dark(#5d6680,#9aa3bd);--line:light-dark(#e2e6f0,#262e48);--soft:light-dark(#eef1f8,#1c2338);--mid:light-dark(#c3c9da,#3a4466);
 --brand:light-dark(#2f4fd8,#7d93ff);--brand-ink:light-dark(#fff,#0d1120);--brand-soft:light-dark(#e6ebff,#222c55);
 --q1:light-dark(#12805c,#37c48f);--q2:light-dark(#3ba776,#6fd3a2);--q3:light-dark(#d4940f,#f2bd45);--q4:light-dark(#e2672a,#ff9a5e);--q5:light-dark(#cf3b4d,#ff6b7c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
p{margin:0}
.mut{color:var(--mut)}.small{font-size:13px}
a{color:inherit}

/* ---------- 2. Top navigation ---------- */
.nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(20,30,70,.25);display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px max(4vw,14px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 19px "Inter Tight",sans-serif}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--q1),var(--brand) 55%,var(--q5));color:#fff;display:grid;place-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs a{text-decoration:none;padding:10px 14px;border-radius:999px;font-weight:600;white-space:nowrap;min-height:44px;display:flex;align-items:center}
.tabs a{color:var(--mut)}.tabs a:hover{color:var(--ink);background:var(--soft)}
.tabs a[aria-current=page]{background:var(--brand-soft);color:var(--brand)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-inline-start:auto}
.sel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.status{font-size:13px;color:var(--mut);padding-inline-start:6px;white-space:nowrap}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--q1);margin-inline-end:6px}
.status.busy::before{background:var(--q3)}

/* ---------- 3. Form controls ---------- */
select,input,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--mid);border-radius:10px;min-height:44px;padding:8px 12px}
textarea{width:100%;min-height:140px;font:13px/1.4 ui-monospace,Menlo,monospace}
input[type=range]{accent-color:var(--brand);border:0;padding:0;width:100%}
input[type=number]{width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--brand);border-radius:999px;background:var(--card);color:var(--brand);font:600 15px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--brand);color:var(--brand-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:hover{box-shadow:0 0 0 3px var(--brand-soft)}

/* ---------- 4. Layout pieces ---------- */
main{max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,14px) 80px}
.view{display:none}.view.on{display:block}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.sec{margin-top:40px}.sec>h2{margin-bottom:6px}.sec>.mut{margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.card{border:1px solid light-dark(#dde1ea,#262e48);border-radius:14px;padding:18px;background:var(--card);box-shadow:0 1px 3px rgba(20,30,70,.08),0 6px 16px -10px rgba(20,30,70,.18)}
.card.click{cursor:pointer;transition:border-color .15s}.card.click:hover{border-color:var(--brand);box-shadow:0 8px 24px -14px rgba(47,79,216,.5)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
.kpi .card b{color:var(--brand);display:block;font:800 clamp(28px,4vw,38px)/1.1 "Inter Tight",sans-serif;margin-top:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--mid);border-radius:999px;padding:8px 14px;min-height:44px;background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.empty{border:1px dashed var(--mid);border-radius:14px;padding:32px;text-align:center;color:var(--mut)}

/* ---------- 5. Quintile badges: Q1 green -> Q5 red ---------- */
.qb{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 8px;border-radius:8px;font:800 14px "Inter Tight",sans-serif;white-space:nowrap;color:#fff}
.q1{background:var(--q1)}.q2{background:var(--q2)}.q3{background:var(--q3)}.q4{background:var(--q4)}.q5{background:var(--q5)}
:root[data-theme=dark] .qb{color:#0d1120}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .qb{color:#0d1120}}
.qb.big{height:56px;min-width:64px;font-size:26px;border-radius:12px}

/* ---------- 6. Metric bars, tables, charts ---------- */
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.mrow span:nth-child(n+2){text-align:right}
.tag{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;vertical-align:bottom;white-space:normal;min-width:84px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
thead th{background:var(--soft)}
td small{display:block;font-size:12px;opacity:.75}
tr.click{cursor:pointer}tr.click:hover td:first-child{text-decoration:underline}
.fig{position:relative;min-height:200px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig text{fill:var(--ink);font:12px Inter,sans-serif}
.pos{font-weight:600;color:var(--q1)}.neg{font-weight:600;color:var(--q5)}

/* ---------- 7. Planner + what-if ---------- */
.plan td:first-child{font-weight:600}
.wi{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.wirow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px 110px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wirow label{font-weight:600;font-size:14px}
.wirow{transition:background .2s}
.wirow.chg{background:var(--brand-soft);border-radius:10px;padding-inline:10px;margin-inline:-10px;border-top-color:transparent;box-shadow:inset 4px 0 0 var(--brand)}
.wirow .mv{display:block;font-size:12px;color:var(--brand);font-weight:700}
.wirow.chg + .wirow{border-top-color:transparent}
.wisrc{display:flex;align-items:center;gap:8px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--soft);margin-bottom:6px}
.wisrc.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.plan td.hl{background:var(--brand-soft);color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.plan td.hl small{opacity:1;font-weight:600}
.wirow input[type=number]{min-height:38px;padding:4px 8px;text-align:right}
.wirow .r{font-size:13px;text-align:right;white-space:nowrap}
.result{position:sticky;top:150px;text-align:center}
.result{background:linear-gradient(180deg,var(--brand-soft),var(--card) 70%)}
.result b{color:var(--brand);display:block;font:800 clamp(48px,8vw,72px)/1 "Inter Tight",sans-serif;margin:8px 0}
.drop{border:2px dashed var(--mid);border-radius:14px;padding:30px 16px;text-align:center;cursor:pointer}
.drop{background:var(--soft)}.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop input{display:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);background:var(--brand);color:var(--brand-ink);padding:12px 18px;border-radius:12px;font-weight:600;max-width:min(92vw,520px);transition:transform .25s;z-index:50;visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- 8. Sign-in screen + view-only notice ---------- */
.login{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:16px}
.login[hidden]{display:none}
.login form{width:min(100%,380px);display:grid;gap:14px;text-align:center;padding:28px}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--mut)}
.remember input{min-height:0;width:18px;height:18px;accent-color:var(--brand)}
.notice{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--brand-soft);border-color:var(--brand-soft);margin-bottom:18px}
:disabled{opacity:.5;cursor:not-allowed}

/* ---------- 9. Small screens ---------- */
@media(max-width:860px){.wi{grid-template-columns:minmax(0,1fr)}.result{position:static}}
@media(max-width:700px){.two{grid-template-columns:minmax(0,1fr)}.filters{margin-inline-start:0;width:100%}.sel{flex:1 1 140px}.sel select{width:100%}
 .wirow{grid-template-columns:minmax(0,1fr) 92px;}.wirow input[type=range]{grid-column:1/-1;order:3}.wirow .r{grid-column:1/-1;order:4;text-align:left}}

</main>

<div class="login" id="login" hidden>
  <form class="card" id="loginForm">

    <h2>Quintile dashboard</h2>

    <button class="btn solid" type="submit">Open dashboard</button>
    <button class="btn" type="button" id="loginCancel" hidden>Keep viewing</button>
  </form>
</div>

// Call commit() after ANY data/settings change: caches here, then saves to the server for everyone
function commit(msg){
  if (!canEdit()) { toast('View only. Sign in with the edit password to make changes.'); render(); return; }
  S.updated = Date.now(); cacheLocal();
  if (msg) toast(msg);
  if (online) { setStatus('Saving…', true); clearTimeout(saveTimer); saveTimer = setTimeout(pushSave, 800); }
  else setStatus('Offline - saved on this device', true);

}
async function pushSave(){
  if (saving) { saveAgain = true; return; }

    const j = await r.json().catch(() => ({}));
    if (r.ok) { serverUpdated = S.updated = j.updated; cacheLocal(); setStatus('Saved for everyone'); }

// Connect to the server: check the password and load the shared data
async function boot(){
  setStatus('Connecting…', true);

      showLogin(getPw() ? 'That password did not work. Try again.' : 'Enter the dashboard password.', false); return; }
    if (!r.ok) throw new Error('no server');
    const j = await r.json();
    online = true; role = j.role === 'edit' ? 'edit' : 'view';
    if (j.data && j.data.rows) { S = j.data; serverUpdated = j.data.updated; } else { S = SEED; serverUpdated = null; }
    cacheLocal(); hideLogin();
    if (wantEdit && role !== 'edit') { showLogin('That is not the edit password. You can keep viewing, or try again.', true); }
    else wantEdit = false;
    setStatus(role === 'edit' ? (serverUpdated ? 'Saved for everyone' : 'Demo data - load yours') : 'View only', role !== 'edit');
    if (role === 'edit' && !j.editConfigured) toast('EDIT_PASSWORD is not set on Netlify yet, so changes cannot be saved.');
  } catch (e) { online = false; role = 'edit'; setStatus('Offline - saved on this device', true); }

}

/* ---------- 4. PREDICTION MODEL ----------
   The overall rank is driven by a weighted score: sum(weight x metric rank). Lower = better.
   From the loaded stores we learn two curves:
     metric value -> metric rank   (e.g. 95% GP/hr ~ rank 60)
     weighted score -> overall rank
   Between known stores we draw straight lines; outside them we extend the trend line.
   More stores loaded = better predictions (load the full region export if you have it). */
function curve(pts){
  const g = new Map();
  pts.forEach(([x, y]) => { if (isFinite(x) && isFinite(y)) { if (!g.has(x)) g.set(x, []); g.get(x).push(y); } });
  const P = [...g].map(([x, ys]) => [x, ys.reduce((a, b) => a + b, 0) / ys.length]).sort((a, b) => a[0] - b[0]);
  if (!P.length) return () => NaN;
  if (P.length === 1) return () => P[0][1];
  const n = P.length, mx = P.reduce((a, p) => a + p[0], 0) / n, my = P.reduce((a, p) => a + p[1], 0) / n;
  let sxy = 0, sxx = 0; P.forEach(([x, y]) => { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; });
  const sec = (P[n - 1][1] - P[0][1]) / (P[n - 1][0] - P[0][0]);
  let b = sxx ? sxy / sxx : 0; if (!b || Math.sign(b) !== Math.sign(sec)) b = sec;
  return x => {
    if (x <= P[0][0]) return P[0][1] + b * (x - P[0][0]);
    if (x >= P[n - 1][0]) return P[n - 1][1] + b * (x - P[n - 1][0]);
    let i = 1; while (P[i][0] < x) i++;
    const [x0, y0] = P[i - 1], [x1, y1] = P[i];
    return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  };
}
const cache = {};

    return {m, ok: true, v: b, rank: Math.round(need)};

}

    if (!r) continue; const st = String(r[col.store] ?? '').trim();

    const [id, ...rest] = st.split(':'), rank = num(r[col.rank]);
    if (!isFinite(rank)) continue;
    const m = {}; let ok = true;
    METRICS.forEach(x => { const v = num(r[col[x.k][0]]), rk = num(r[col[x.k][1]]); if (!isFinite(v) || !isFinite(rk)) ok = false; m[x.k] = [v, Math.round(rk)]; });
    if (!ok) continue;
    const q = num(r[col.q]);
    out.push({month: monthOf(r[col.month], fallbackMonth), id: id.trim(), store: (rest.join(':') || id).trim(), q: isFinite(q) ? q : quint(rank), rank: Math.round(rank), m});
  }
  if (!out.length) throw new Error('Header found, but no store rows could be read.');
  return {rows: out, label};
}
function addRows(res, replace){
  if (replace) S.rows = []; else S.rows = S.rows.filter(r => !r.sample); // demo rows make way for real data
  const keys = new Set(res.rows.map(r => r.month + '|' + r.id));
  S.rows = S.rows.filter(r => !keys.has(r.month + '|' + r.id)).concat(res.rows);
  if (res.label) S.settings.label = res.label;
  const ms = [...new Set(res.rows.map(r => r.month))];
  ui.month = ms.sort((a, b) => mk(b) - mk(a))[0];
  commit(`Loaded ${res.rows.length} store rows for ${ms.join(', ')}`);
}
async function importFiles(files){
  if (!window.XLSX) { toast('The Excel reader did not load. Copy the cells in Excel and use "Paste from Excel".'); return; }
  const all = {rows: [], label: null}, errs = [];
  for (const f of files) {
    try {
      const wb = XLSX.read(await f.arrayBuffer(), {type: 'array', cellDates: true});
      let got = false;
      for (const name of wb.SheetNames) {
        try { const res = parseGrid(XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true}), $('pMonth')?.value);
              all.rows.push(...res.rows); all.label = all.label || res.label; got = true; } catch (e) {}
      }
      if (!got) errs.push(f.name);
    } catch (e) { errs.push(f.name); }
  }
  if (all.rows.length) addRows(all, $('mode')?.value === 'replace');
  if (errs.length) toast('Could not read: ' + errs.join(', '));
}

    <div class="card"><h3>Paste from Excel</h3><p class="small mut" style="margin:4px 0 12px">Select the table in Excel including the header row, copy, and paste here.</p>
      <textarea id="paste" placeholder="Month&#9;Sap: Loaction&#9;Quintile Position&#9;Overall Rank&#9;..."></textarea>
      <div class="chips" style="margin-top:10px;align-items:center"><label class="sel">Month if missing <input id="pMonth" value="${pad(now.getMonth() + 1)}/${now.getFullYear()}" style="width:110px"></label><button class="btn solid" id="doPaste">Load pasted data</button></div></div>
  </div>
  <div class="sec"><h2>Months saved on the dashboard</h2><p class="mut">${S.rows.length} store rows. ${online ? 'Saved on the server, so everyone with the link sees the same data.' : 'Offline: changes are saved on this device only.'}${!serverUpdated && online ? ' You are looking at demo data until the first real load.' : ''}</p>
    <div class="scroll card" style="padding:0"><table><thead><tr><th>Month</th><th>Stores</th><th>Type</th><th></th></tr></thead><tbody>
    ${ms.map(m => { const rs = rowsFor(m); return `<tr><td><b>${esc(m)}</b></td><td>${rs.length}</td><td>${rs.some(r => r.sample) ? 'Sample' : 'Imported'}</td><td><button class="btn sm" data-del="${esc(m)}">Remove</button></td></tr>`; }).join('') || '<tr><td colspan="4">Nothing loaded yet</td></tr>'}
    </tbody></table></div>
    ${S.rows.some(r => r.sample) ? '<button class="btn sm" id="delSample" style="margin-top:10px">Remove all sample months</button>' : ''}</div>
  <div class="sec two">
    <div class="card"><h3>Metric weights</h3><p class="small mut" style="margin:4px 0 8px">From your scorecard. Total <b id="wsum"></b></p>
      ${METRICS.map(m => `<div class="row" style="padding:5px 0;border-top:1px solid var(--line);align-items:center"><label for="w-${m.k}">${esc(m.label)}</label><input type="number" id="w-${m.k}" data-w="${m.k}" value="${S.settings.weights[m.k]}" step="1" style="width:90px;text-align:right"></div>`).join('')}</div>
    <div class="card"><h3>Quintile cut-offs</h3><p class="small mut" style="margin:4px 0 8px">Rank range for each quintile.</p>
      ${S.settings.quint.map((q, i) => `<div class="row" style="padding:5px 0;border-top:1px solid var(--line);align-items:center">${qb(i + 1)}<span style="display:flex;gap:6px;align-items:center"><input type="number" data-qi="${i}" data-qj="0" value="${q[0]}" style="width:80px" aria-label="Q${i + 1} min rank"> to <input type="number" data-qi="${i}" data-qj="1" value="${q[1]}" style="width:80px" aria-label="Q${i + 1} max rank"></span></div>`).join('')}
      <div class="row" style="padding:5px 0;border-top:1px solid var(--line);align-items:center"><label for="tot">Stores ranked in total</label><input type="number" id="tot" value="${N()}" style="width:90px"></div>
      <div class="row" style="padding:5px 0;border-top:1px solid var(--line);align-items:center"><label for="lbl">Dashboard label</label><input id="lbl" value="${esc(S.settings.label || '')}" style="width:180px"></div></div>
  </div>
  <div class="sec card"><h3>Backup and restore</h3><p class="small mut" style="margin:4px 0 12px">Download or copy a backup of all data, or paste one back in.</p>
    <textarea id="bk" placeholder="Paste a backup here to restore it"></textarea>
    <div class="chips" style="margin-top:10px"><button class="btn" id="dlBk" type="button">Download backup</button><button class="btn" id="copyBk">Copy backup</button><button class="btn" id="restore">Restore from box</button></div></div>`;
  const wsum = () => $('wsum').textContent = METRICS.reduce((s, m) => s + (+S.settings.weights[m.k] || 0), 0) + '%'; wsum();
  $('file').onchange = e => importFiles([...e.target.files]);
  const dr = $('drop');
  dr.ondragover = e => { e.preventDefault(); dr.classList.add('over'); };
  dr.ondragleave = () => dr.classList.remove('over');
  dr.ondrop = e => { e.preventDefault(); dr.classList.remove('over'); importFiles([...e.dataTransfer.files]); };
  $('doPaste').onclick = () => {
    const t = $('paste').value.trim(); if (!t) return toast('Paste the Excel cells first');
    const grid = t.split(/\r?\n/).map(l => l.split(l.includes('\t') ? '\t' : ','));
    try { addRows(parseGrid(grid, $('pMonth').value.trim()), $('mode').value === 'replace'); } catch (e) { toast(e.message); }
  };
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (b.dataset.armed) { S.rows = S.rows.filter(r => r.month !== b.dataset.del); commit('Removed ' + b.dataset.del); }
    else { b.dataset.armed = 1; b.textContent = 'Tap again to remove'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Remove'; } }, 3000); }
  });
  if ($('delSample')) $('delSample').onclick = () => { S.rows = S.rows.filter(r => !r.sample); commit('Sample months removed'); };
  el.querySelectorAll('[data-w]').forEach(i => i.onchange = () => { S.settings.weights[i.dataset.w] = +i.value || 0; commit('Weights saved'); });
  el.querySelectorAll('[data-qi]').forEach(i => i.onchange = () => { S.settings.quint[+i.dataset.qi][+i.dataset.qj] = +i.value; commit('Cut-offs saved'); });
  $('tot').onchange = e => { S.settings.total = Math.max(2, +e.target.value || 334); commit('Saved'); };
  $('lbl').onchange = e => { S.settings.label = e.target.value; commit('Saved'); };
  $('dlBk').onclick = () => { const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'}));
    a.download = 'quintile-backup-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  if (!canEdit()) {
    el.querySelectorAll('input,select,textarea,button').forEach(x => { if (!['dlBk', 'copyBk', 'signEdit'].includes(x.id)) x.disabled = true; });
    $('drop').style.pointerEvents = 'none';
    $('signEdit').onclick = () => { wantEdit = true; showLogin('Enter the edit password.', true); };
  }
  $('copyBk').onclick = async () => { const t = JSON.stringify(S); try { await navigator.clipboard.writeText(t); toast('Backup copied'); } catch (e) { $('bk').value = t; $('bk').select(); toast('Copy the text in the box'); } };
  $('restore').onclick = () => { try { const d = JSON.parse($('bk').value); if (!Array.isArray(d.rows) || !d.settings) throw 0; S = d; commit('Backup restored'); } catch (e) { toast('That does not look like a dashboard backup'); } };
}

/* ---------- 9. START-UP + ROUTING ---------- */
function fillFilters(){
  const ms = months(); if (!ms.includes(ui.month)) ui.month = ms[0] || '';
  $('fMonth').innerHTML = ms.map(m => `<option>${esc(m)}</option>`).join(''); $('fMonth').value = ui.month;
  const stores = [...new Map(S.rows.map(r => [r.id, r.store])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  if (!stores.some(s => s[0] === ui.store)) ui.store = (rowsFor(ui.month)[0] || {}).id || '';
  $('fStore').innerHTML = stores.map(([id, nm]) => `<option value="${esc(id)}">${esc(nm)} (${esc(id)})</option>`).join(''); $('fStore').value = ui.store;
}
function render(){
  $('boot')?.remove();
  const tab = ['overview', 'store', 'data'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
  fillFilters();
  document.querySelectorAll('.tabs a').forEach(a => a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));
  if (tab === 'overview') renderOverview(); else if (tab === 'store') renderStore(); else renderData();
}
$('fMonth').onchange = e => { ui.month = e.target.value; whatif = null; saveUI(); render(); };
$('fStore').onchange = e => openStore(e.target.value);
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.card.click')) openStore(e.target.dataset.id); });
$('loginForm').onsubmit = e => { e.preventDefault(); setPw($('pw').value, $('remember').checked); boot(); };
$('loginCancel').onclick = () => { wantEdit = false; hideLogin(); };
$('acct').onclick = () => {
  if (role === 'edit') { setPw(''); role = 'view'; wantEdit = false; toast('Signed out'); boot(); }
  else { wantEdit = true; showLogin('Enter the edit password.', true); }
};
boot();
}
</script></body></html>
